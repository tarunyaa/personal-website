<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Private Reading Room | Stream of Taru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #fcfcfc; --text: #1a1a2e; --text-secondary: #4a4a5a;
            --text-muted: #8a8a9a; --text-dim: #b8b8c8; --accent: #1e2a4a;
            --accent-light: #2d3f6e; --accent-wash: rgba(30, 42, 74, 0.05);
            --border: #ebebf0; --card-bg: #ffffff;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif; background: var(--bg);
            color: var(--text); line-height: 1.7; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: var(--accent); color: #fff; }
        a { color: var(--text); text-decoration: none; transition: color 0.2s; }
        a:hover { color: var(--accent-light); }
        button, input { font: inherit; }
        button { cursor: pointer; }
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 0 48px; height: 54px; display: flex;
            justify-content: space-between; align-items: center;
            background: rgba(252, 252, 252, 0.9); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border);
        }
        .nav-name {
            font-family: 'Newsreader', Georgia, serif; font-weight: 400;
            font-size: 17px; font-style: italic; color: var(--accent); letter-spacing: -0.3px;
            flex-shrink: 0;
        }
        .nav-actions { display: flex; align-items: center; gap: 22px; }
        .nav-back, .lock-button {
            border: 0; background: transparent; font-size: 13px; font-weight: 400;
            color: var(--text-muted); letter-spacing: 0.2px;
        }
        .nav-back { white-space: nowrap; }
        .nav-back:hover, .lock-button:hover { color: var(--accent); }
        main { max-width: 640px; margin: 0 auto; padding: 108px 24px 80px; }
        .section-label {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
            letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted);
            margin-bottom: 24px;
        }
        .room-intro, .login-copy {
            font-family: 'Newsreader', Georgia, serif; font-size: 17px; line-height: 1.9;
            font-weight: 300; color: var(--text-secondary); margin-bottom: 38px;
        }
        .writing-list { display: flex; flex-direction: column; }
        .writing-item {
            display: flex; align-items: baseline; padding: 11px 0;
            border-bottom: 1px solid var(--border); gap: 20px;
        }
        .writing-item:first-child { padding-top: 0; }
        .writing-item:last-child { border-bottom: none; }
        .writing-date {
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            color: var(--text-dim); flex-shrink: 0; font-variant-numeric: tabular-nums;
            min-width: 64px;
        }
        .writing-title { font-size: 14px; flex: 1; }
        .writing-title a { color: var(--text); }
        .writing-title a:hover { color: var(--accent); }
        .writing-kind {
            font-family: 'JetBrains Mono', monospace; font-size: 10px;
            letter-spacing: .7px; text-transform: uppercase; color: var(--text-dim);
            flex-shrink: 0;
        }
        .login-copy { margin-bottom: 26px; }
        .login-form { display: flex; gap: 8px; }
        .login-form input {
            min-width: 0; flex: 1; padding: 10px 12px; border: 1px solid var(--border);
            border-radius: 4px; background: var(--card-bg); color: var(--text);
            font-size: 14px; outline: none;
        }
        .login-form input:focus { border-color: var(--text-dim); }
        .login-form button {
            padding: 10px 16px; border: 1px solid var(--accent); border-radius: 4px;
            background: var(--accent); color: white; font-size: 13px;
        }
        .error { min-height: 22px; margin-top: 10px; color: #a3382e; font-size: 12px; }
        .post-meta { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
        .post-date {
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            color: var(--text-dim); font-variant-numeric: tabular-nums;
        }
        .post-tag {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
            letter-spacing: 1px; text-transform: uppercase; color: var(--accent);
            background: var(--accent-wash); border: 1px solid var(--border);
            padding: 2px 10px; border-radius: 4px;
        }
        .post-read-time { font-size: 12px; color: var(--text-dim); }
        h1 {
            font-family: 'Newsreader', Georgia, serif; font-size: 34px; font-weight: 400;
            margin-bottom: 44px; line-height: 1.3; color: var(--text); letter-spacing: -0.3px;
        }
        .post-content {
            font-family: 'Newsreader', Georgia, serif; font-size: 17px; line-height: 1.9;
            color: var(--text); font-weight: 300;
        }
        .post-content p { margin-bottom: 24px; }
        .post-content h2 {
            font-family: 'Newsreader', Georgia, serif; font-size: 24px; line-height: 1.35;
            font-weight: 400; margin: 48px 0 18px; color: var(--text);
        }
        .post-content h3 {
            font-family: 'Newsreader', Georgia, serif; font-size: 19px; line-height: 1.5;
            font-weight: 500; margin: 34px 0 12px; color: var(--text);
        }
        .post-content ul, .post-content ol { margin: 0 0 24px; padding-left: 24px; }
        .post-content li { margin-bottom: 6px; }
        .post-content blockquote {
            border-left: 2px solid var(--border); margin: 28px 0; padding-left: 20px;
            color: var(--text-secondary); font-style: italic;
        }
        .post-content em { font-style: italic; color: var(--accent); }
        .post-content a {
            color: var(--text-secondary); text-decoration-line: underline;
            text-decoration-color: var(--border); text-underline-offset: 3px;
        }
        .post-content a:hover { color: var(--accent); text-decoration-color: var(--accent); }
        .post-content code {
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
            background: var(--accent-wash); padding: 1px 5px; border-radius: 4px;
        }
        .post-content pre {
            overflow-x: auto; margin: 28px 0; padding: 18px; border: 1px solid var(--border);
            background: var(--accent-wash); border-radius: 4px; white-space: pre-wrap;
        }
        .post-content pre code { padding: 0; background: transparent; }
        .post-footer { padding-top: 48px; margin-top: 56px; border-top: 1px solid var(--border); }
        .post-footer a { font-size: 13px; color: var(--text-muted); }
        .post-footer a:hover { color: var(--accent); }
        .empty { color: var(--text-muted); font-size: 13px; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn .35s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 640px) {
            nav { padding: 0 20px; }
            main { padding: 90px 20px 60px; }
            h1 { font-size: 28px; }
            .writing-kind { display: none; }
            .writing-item { gap: 14px; }
            .login-form { align-items: stretch; flex-direction: column; }
            .lock-button { display: none; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="nav-name">Stream of Taru</a>
        <div class="nav-actions">
            <a id="nav-back" href="/" class="nav-back">&larr; back home</a>
            <button id="logout" class="lock-button hidden" type="button">lock</button>
        </div>
    </nav>
    <main id="login-view" class="hidden fade-in">
        <div class="section-label">Private Reading Room</div>
        <p class="login-copy">Morning curiosities and midday bookmark seminars, kept in a private daily archive.</p>
        <form id="login-form" class="login-form">
            <input id="password" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required autofocus>
            <button type="submit">Enter</button>
        </form>
        <div class="error" id="login-error" aria-live="polite"></div>
    </main>
    <main id="archive-view" class="hidden fade-in">
        <div class="section-label">Private Reading Room</div>
        <p class="room-intro">A daily archive of ideas worth returning to.</p>
        <div id="archive-list" class="writing-list"></div>
    </main>
    <main id="reader-view" class="hidden fade-in"><div id="reader"></div></main>

    <script>
        const loginView = document.getElementById('login-view');
        const archiveView = document.getElementById('archive-view');
        const readerView = document.getElementById('reader-view');
        const archiveList = document.getElementById('archive-list');
        const reader = document.getElementById('reader');
        const navBack = document.getElementById('nav-back');
        const logout = document.getElementById('logout');
        let manifest = [];
        const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        })[char]);

        function inline(text) {
            return escapeHtml(text)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        }

        function markdown(source) {
            source = source.replace(/<heartbeat>[\s\S]*?<\/heartbeat>/g, '').replace(/^:::writing[^\n]*\n|^:::\s*$/gm, '');
            const lines = source.split(/\r?\n/); const out = [];
            let list = null, quote = [], code = [], inCode = false;
            const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
            const closeQuote = () => { if (quote.length) { out.push(`<blockquote>${inline(quote.join(' '))}</blockquote>`); quote = []; } };
            for (const line of lines) {
                if (line.startsWith('```')) {
                    closeList(); closeQuote();
                    if (inCode) { out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`); code = []; }
                    inCode = !inCode; continue;
                }
                if (inCode) { code.push(line); continue; }
                if (/^>\s?/.test(line)) { closeList(); quote.push(line.replace(/^>\s?/, '')); continue; }
                closeQuote();
                const heading = line.match(/^(#{2,3})\s+(.+)/);
                if (heading) { closeList(); const level = heading[1].length; out.push(`<h${level}>${inline(heading[2])}</h${level}>`); continue; }
                const unordered = line.match(/^[-*]\s+(.+)/); const ordered = line.match(/^\d+\.\s+(.+)/);
                if (unordered || ordered) {
                    const next = unordered ? 'ul' : 'ol';
                    if (list !== next) { closeList(); out.push(`<${next}>`); list = next; }
                    out.push(`<li>${inline((unordered || ordered)[1])}</li>`); continue;
                }
                closeList();
                if (!line.trim() || /^#\s+/.test(line)) continue;
                out.push(`<p>${inline(line)}</p>`);
            }
            closeList(); closeQuote(); return out.join('');
        }

        async function api(options = {}) {
            const response = await fetch('/api/briefs' + (options.slug ? `?slug=${encodeURIComponent(options.slug)}` : ''), {
                method: options.method || 'GET', headers: options.body ? { 'Content-Type': 'application/json' } : {},
                body: options.body ? JSON.stringify(options.body) : undefined
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw Object.assign(new Error(body.error || 'Something went wrong.'), { status: response.status });
            return body;
        }
        function showOnly(view) {
            [loginView, archiveView, readerView].forEach(node => node.classList.toggle('hidden', node !== view));
            view.classList.remove('fade-in'); void view.offsetWidth; view.classList.add('fade-in');
        }
        function dateLabel(date) { const [year, month, day] = date.split('-'); return `${day}.${month}.${year.slice(2)}`; }
        function drawArchive() {
            archiveList.innerHTML = '';
            manifest.forEach(item => {
                const row = document.createElement('div'); row.className = 'writing-item';
                const kind = item.type === 'morning' ? 'morning' : 'midday';
                row.innerHTML = `<span class="writing-date">${escapeHtml(dateLabel(item.date))}</span><span class="writing-title"><a href="#${escapeHtml(item.slug)}">${escapeHtml(item.title)}</a></span><span class="writing-kind">${kind}</span>`;
                archiveList.appendChild(row);
            });
        }
        function showArchive(updateUrl = true) {
            if (updateUrl) history.pushState(null, '', '/private-reading-room');
            navBack.href = '/'; navBack.innerHTML = '&larr; back home';
            showOnly(archiveView); window.scrollTo(0, 0);
        }
        async function openReading(slug) {
            if (!manifest.some(item => item.slug === slug)) return showArchive();
            showOnly(readerView); reader.innerHTML = '<p class="empty">Opening…</p>';
            navBack.href = '/private-reading-room'; navBack.innerHTML = '&larr; private reading room';
            try {
                const item = await api({ slug });
                const articleMarkdown = item.markdown.replace(/^#{1,2}\s+[^\n]+\n+/, '');
                const minutes = Math.max(1, Math.round(articleMarkdown.trim().split(/\s+/).length / 220));
                reader.innerHTML = `<div class="post-meta"><span class="post-date">${escapeHtml(dateLabel(item.date))}</span><span class="post-tag">${escapeHtml(item.type)}</span><span class="post-read-time">${minutes} min read</span></div><h1>${escapeHtml(item.title)}</h1><div class="post-content">${markdown(articleMarkdown)}</div><div class="post-footer"><a href="/private-reading-room">&larr; back to private reading room</a></div>`;
                window.scrollTo(0, 0);
            } catch (error) {
                if (error.status === 401) return showLogin();
                reader.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
            }
        }
        function showLogin(message = '') {
            showOnly(loginView); logout.classList.add('hidden'); navBack.href = '/';
            navBack.innerHTML = '&larr; back home'; document.getElementById('login-error').textContent = message;
        }
        async function route() { const slug = location.hash.slice(1); if (slug) await openReading(slug); else showArchive(false); }
        async function boot() {
            try {
                const data = await api(); manifest = data.briefs || []; drawArchive();
                logout.classList.remove('hidden'); await route();
            } catch (error) { showLogin(error.status === 401 ? '' : error.message); }
        }
        document.getElementById('login-form').addEventListener('submit', async event => {
            event.preventDefault(); const errorNode = document.getElementById('login-error'); errorNode.textContent = '';
            try {
                await api({ method: 'POST', body: { password: document.getElementById('password').value } });
                document.getElementById('password').value = ''; await boot();
            } catch (error) { errorNode.textContent = error.message; }
        });
        logout.addEventListener('click', async () => {
            await api({ method: 'DELETE' }).catch(() => {}); history.replaceState(null, '', '/private-reading-room'); showLogin();
        });
        navBack.addEventListener('click', event => {
            if (!readerView.classList.contains('hidden')) { event.preventDefault(); showArchive(); }
        });
        window.addEventListener('hashchange', route); window.addEventListener('popstate', route); boot();
    </script>
</body>
</html>
